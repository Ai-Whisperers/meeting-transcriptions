name: meeting-pipeline

on:
  # Manual trigger from GitHub UI — the user runs this from their phone/laptop
  workflow_dispatch:
    inputs:
      meeting_id:
        description: "Single meeting id to process (YYYY-MM-DD_slug). Leave blank for all."
        required: false
        type: string
      force:
        description: "Re-run all stages even if outputs exist."
        required: false
        type: boolean
        default: false

  # Nightly at 03:00 UTC = 23:00 PYT — runs the full pipeline
  schedule:
    - cron: "0 3 * * *"

  # Trigger when new audio lands in the Drive folder (via a separate watcher PR)

concurrency:
  group: meeting-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MT_INBOX: /opt/data/inbox/meetings
      MT_INDEX: /opt/data/indexed/meetings
      # Pull from GitHub Actions LIGARE environment (secrets, never inline)
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            whisperx==3.1.5 \
            litellm \
            google-api-python-client \
            google-auth \
            jsonschema

      - name: Write Drive service-account key
        if: env.GOOGLE_SA_JSON
        run: |
          mkdir -p /tmp/secrets
          echo "$GOOGLE_SA_JSON" > /tmp/secrets/sa.json
          echo "MT_GOOGLE_SA_JSON=/tmp/secrets/sa.json" >> $GITHUB_ENV

      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "${{ inputs.meeting_id }}" ]; then
            ARGS="--meeting ${{ inputs.meeting_id }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          bash ./run_all.sh $ARGS

      - name: Upload indexes as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-indexes-${{ github.run_id }}
          path: /opt/data/indexed/meetings/

      - name: Commit updated indexes back to repo
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@ai-whisperers.dev"
          git add index/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(indexes): regenerate after pipeline run ${{ github.run_id }}"
            git push
          fi